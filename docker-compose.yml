services:
  postgres:
    image: postgres:16.4
    container_name: ticketbox-postgres
    environment:
      POSTGRES_DB: ticketbox
      POSTGRES_USER: ticketbox
      POSTGRES_PASSWORD: ticketbox
    ports: ["5434:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketbox -d ticketbox"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4
    container_name: ticketbox-redis
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: ticketbox-mailpit
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata: